services:
  - type: web
    name: insurance-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt && python ml_pipeline.py
    startCommand: gunicorn backend.app:create_app() --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
