services:
  - type: web
    name: insureai-pro-api
    env: python

    buildCommand: pip install -r requirements.txt

    startCommand: gunicorn backend.app:create_app\(\) --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

      - key: SECRET_KEY
        generateValue: true
